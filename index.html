<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guess The Category</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>

  <div class="app-container">
    <header>
      <div class="logo-container">
        <img src="GTC-12345QuestionMark.jpg" alt="Guess The Category Logo" class="question-mark-logo-img">
        <h1>Guess The Category</h1>
      </div>
      <p class="tagline">Can you guess the hidden category using 5 sequential clues?</p>
      
      <div class="top-bar">
        <div class="controls-group">
          <label for="difficulty-select" style="font-weight: 600; font-size: 0.9rem; color: #475569;">Level:</label>
          <select id="difficulty-select">
            <option value="easy">Easy</option>
            <option value="medium">Medium</option>
            <option value="hard">Hard</option>
            <option value="ultra">Ultra (45s)</option>
          </select>
        </div>

        <button id="open-stats-btn" class="btn-icon">
          <span>📊</span> Stats
        </button>
      </div>
    </header>

    <div id="timer-display" class="timer-box" style="display: none;">
      ⏱ Time Remaining: 45s
    </div>

    <!-- Active Game Play Area: Clues + Dynamic Input Section Below -->
    <main class="game-play-area" id="game-play-area">
      <div class="clues-container" id="clues-container">
        <!-- Revealed clue cards will be appended here dynamically -->
      </div>

      <section class="input-section" id="input-section">
        <input type="text" id="guess-input" placeholder="Type your guess here..." autocomplete="off">
        <button id="submit-btn" class="btn-primary">Submit</button>
        <button id="next-btn" class="btn-success" style="display: none;">Next Category ➔</button>
      </section>
    </main>

    <div id="feedback" class="feedback-area"></div>
  </div>

  <!-- Stats Modal -->
  <div id="stats-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Statistics</h2>
        <button id="close-stats-btn" class="close-btn">&times;</button>
      </div>

      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-value" id="stat-played">0</div>
          <div class="stat-label">Played</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="stat-win-rate">0%</div>
          <div class="stat-label">Win %</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="stat-streak">0</div>
          <div class="stat-label">Streak</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="stat-max-streak">0</div>
          <div class="stat-label">Max Streak</div>
        </div>
      </div>

      <div class="distribution-section">
        <h3>Guess Distribution (Clue # Won)</h3>
        <div class="dist-row">
          <span>Clue 1</span>
          <div class="dist-bar-bg"><div id="dist-bar-1" class="dist-bar-fill"><span id="dist-count-1">0</span></div></div>
        </div>
        <div class="dist-row">
          <span>Clue 2</span>
          <div class="dist-bar-bg"><div id="dist-bar-2" class="dist-bar-fill"><span id="dist-count-2">0</span></div></div>
        </div>
        <div class="dist-row">
          <span>Clue 3</span>
          <div class="dist-bar-bg"><div id="dist-bar-3" class="dist-bar-fill"><span id="dist-count-3">0</span></div></div>
        </div>
        <div class="dist-row">
          <span>Clue 4</span>
          <div class="dist-bar-bg"><div id="dist-bar-4" class="dist-bar-fill"><span id="dist-count-4">0</span></div></div>
        </div>
        <div class="dist-row">
          <span>Clue 5</span>
          <div class="dist-bar-bg"><div id="dist-bar-5" class="dist-bar-fill"><span id="dist-count-5">0</span></div></div>
        </div>
      </div>

      <button id="reset-stats-btn" class="btn-danger-outline">Reset Stats</button>
    </div>
  </div>

  <script src="stats.js"></script>
  <script src="app.js"></script>
</body>
</html>
